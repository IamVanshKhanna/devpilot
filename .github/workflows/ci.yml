name: CI

on:
  push:
    branches: [main, feat/zero-cost-backend]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AI_BACKEND: mock          # FREE, deterministic, no secrets/network
      GITHUB_APP_ID: "123456"
      GITHUB_PRIVATE_KEY: "test"
      GITHUB_WEBHOOK_SECRET: "webhook_secret_for_testing"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
